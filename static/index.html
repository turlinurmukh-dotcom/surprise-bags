<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sarqyt</title>
<link rel="icon" type="image/png" href="/assets/sarqyt-heart-32.png" />
<link rel="apple-touch-icon" href="/assets/sarqyt-heart-192.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#9A3324" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://mapgl.2gis.com/api/js/v1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Sarqyt brand palette — deliberately ignores Telegram's --tg-theme-*
     variables AND the user's system dark/light setting. This app is
     always light, as a brand identity, regardless of host theme.
     Locked palette — see .claude/sarqyt-mark.pdf for the source sheet. */
  :root {
    --bg: #F3E6CF;              /* parchment */
    --surface: #F5ECD8;         /* card surface — a lighter tint of parchment, not white */
    --accent: #9A3324;          /* crimson */
    --accent-deep: #7A2A1D;     /* crimson-deep, shadows on crimson surfaces */
    --accent-text: #F3E6CF;     /* parchment text on crimson */
    --gold: #C08A34;            /* gold */
    --gold-soft: #DCBD82;       /* gold-soft, lighter accents/highlights */
    --text: #2E2013;            /* ink */
    --text-hint: #7A6852;       /* ink-soft */
    --border: #E4D5B7;
    --shadow: rgba(46, 32, 19, 0.10);

    --space-1: 8px;
    --space-2: 16px;
    --space-3: 24px;

    --chip-bakery: #EEDCB8;
    --chip-cafe_lunch: #E9D5B0;
    --chip-restaurant_meal: #E6CBB9;
    --chip-grocery: #EBDCAE;
    --chip-other: #E2D3B4;

    /* --font-wordmark: the literal "Sarqyt" brand lockup ONLY — Fraunces
       has no Cyrillic glyphs, so it must never be used for translatable
       text. Everything else (headings, merchant names, UI copy in all
       three languages) uses --font-ui.
       --font-ui: Noto Sans — verified via Google Fonts' own served CSS to
       cover Latin, standard Russian Cyrillic, AND the five Kazakh-specific
       Cyrillic letters (Ә Ғ Қ Ң Ұ, plus Ө Һ І) across its cyrillic and
       cyrillic-ext subsets at weights 400/500/600/700. Manrope covered
       Russian but silently dropped to a fallback font mid-word for those
       Kazakh letters specifically — replaced everywhere, not just in KZ
       mode, so EN/RU/KZ render with one consistent typeface. */
    --font-wordmark: "Fraunces", serif;
    --font-ui: "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    padding-bottom: var(--space-3);
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: var(--space-2) 0 var(--space-1);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    border-bottom: 1px solid var(--border);
  }

  /* Content column: caps and centers the actual UI on wide viewports
     (desktop Telegram, a resized browser, fullscreen) instead of letting
     it stretch edge-to-edge. Scales continuously with viewport width via
     max-width, not gated to one breakpoint. The header's own background/
     border-bottom stay full-bleed; only this inner wrapper is capped.
     Horizontal padding lives here (not on header/main) so both contexts
     inset their content by the same amount at the same layer — otherwise
     header content and the card grid below it end up misaligned by
     whatever padding header/main apply on top of their own boxes. */
  .content-col {
    max-width: 1000px;
    margin: 0 auto;
    padding-left: var(--space-2);
    padding-right: var(--space-2);
  }

  h1 {
    font-family: var(--font-ui);
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 var(--space-2);
    letter-spacing: 0.01em;
  }
  #browseScreen h1 {
    padding-right: 90px;
    overflow-wrap: break-word;
  }
  @media (max-width: 420px) {
    #browseScreen h1 { font-size: 18px; }
  }

  /* Brand lockup: icon + wordmark, per sarqyt-mark.pdf's primary lockup.
     Clear space of one knot-diameter (~10px at this icon size) is given
     via the gap and the margin below. */
  .brand-lockup {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: var(--space-2);
  }
  .brand-mark {
    width: 28px;
    height: 28px;
    flex: 0 0 auto;
    display: block;
  }
  .brand-word {
    /* The literal "Sarqyt" wordmark — always Latin, regardless of
       interface language, so this is the one place Fraunces belongs. */
    font-family: var(--font-wordmark);
    font-weight: 600;
    font-size: 20px;
    color: var(--accent);
    letter-spacing: 0.01em;
  }

  /* On a crimson (or any dark) fill, the default mark's crimson body
     disappears into the ground — swap to sarqyt-heart-light-28.png, and the
     wordmark to parchment. Not used by any current component (nothing in
     this app places the mark on a crimson surface yet), but ready for the
     next one that does — e.g. a splash/confirmation state on .reserve-btn. */
  .brand-lockup.on-crimson .brand-mark { content: url("/assets/sarqyt-heart-light-28.png"); }
  .brand-lockup.on-crimson .brand-word { color: var(--accent-text); }

  .filters {
    display: flex;
    gap: var(--space-1);
    overflow-x: auto;
    padding-bottom: var(--space-1);
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }

  .filter-chip {
    flex: 0 0 auto;
    padding: 7px 16px;
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border);
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }
  .filter-chip.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    row-gap: var(--space-1);
    column-gap: var(--space-1);
    margin-top: var(--space-2);
    align-items: center;
    justify-content: space-between;
  }

  .toolbar-dropdowns {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-1);
    flex: 1 1 auto;
    min-width: 0;
  }

  /* Custom dropdown — replaces native <select> entirely */
  .dropdown {
    position: relative;
  }
  .dropdown-trigger {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .dropdown-trigger .chev {
    font-size: 10px;
    color: var(--text-hint);
    transition: transform 0.15s ease;
  }
  .dropdown.open .dropdown-trigger .chev { transform: rotate(180deg); }
  .dropdown-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 160px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 8px 24px var(--shadow);
    overflow: hidden;
    z-index: 20;
    display: none;
  }
  .dropdown.open .dropdown-menu { display: block; }
  .dropdown-option {
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text);
  }
  .dropdown-option:hover { background: var(--bg); }
  .dropdown-option.selected { color: var(--accent); font-weight: 700; }

  .view-toggle {
    display: flex;
    flex: 0 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .view-toggle button {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: none;
    background: transparent;
    color: var(--text-hint);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .view-toggle button svg { width: 15px; height: 15px; }
  .view-toggle button.active {
    background: var(--accent);
    color: var(--accent-text);
  }

  main {
    padding-top: var(--space-2);
    padding-bottom: var(--space-2);
    animation: view-in 180ms ease-out;
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-2);
  }
  @keyframes view-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Desktop: wider viewport gets a multi-column card grid instead of a
     stretched single column. Only the browse listing grid goes
     multi-column — the profile/orders list stays single-column at any
     width, matching a typical "my orders" pattern. Content is capped and
     centered via .content-col (see header rule above), independent of
     these column-count breakpoints. */
  @media (min-width: 768px) {
    #listView { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 1100px) {
    #listView { grid-template-columns: repeat(3, 1fr); }
  }

  .card, .merchant-card {
    display: flex;
    gap: var(--space-2);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: var(--space-2);
    box-shadow: 0 2px 8px var(--shadow);
    animation: card-in 220ms ease-out backwards;
  }
  .merchant-card {
    align-items: center;
    cursor: pointer;
    border: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
    color: inherit;
  }
  .merchant-card:active { transform: scale(0.99); }
  .merchant-card .card-photo { width: 64px; height: 64px; }
  .merchant-card-body { flex: 1; min-width: 0; }
  .merchant-card-pickup {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
  }
  .merchant-card-bag-count {
    font-size: 12px;
    color: var(--text-hint);
    margin-top: 2px;
  }
  .merchant-card-chevron {
    flex: 0 0 auto;
    color: var(--text-hint);
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: var(--space-1) 0;
    cursor: pointer;
  }

  .merchant-detail-header {
    display: flex;
    gap: var(--space-2);
    align-items: center;
    margin-bottom: var(--space-2);
  }
  .merchant-detail-photo {
    width: 88px;
    height: 88px;
    border-radius: 18px;
    background: var(--bg);
    flex: 0 0 auto;
    overflow: hidden;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
  }
  .merchant-detail-photo img { width: 100%; height: 100%; object-fit: cover; }
  .merchant-detail-name { font-family: var(--font-ui); font-weight: 700; font-size: 20px; }
  .merchant-detail-location { color: var(--text-hint); font-size: 13px; margin-top: 2px; }
  .merchant-detail-description { font-size: 13px; font-style: italic; color: var(--text-hint); margin-top: 4px; }
  .merchant-detail-rating { color: var(--gold); font-size: 13px; font-weight: 600; margin-top: 6px; }
  .merchant-detail-rating-breakdown {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 11.5px;
    color: var(--text-hint);
    margin-top: 3px;
  }
  .merchant-detail-bags-title {
    font-family: var(--font-ui);
    font-size: 15px;
    font-weight: 700;
    margin: var(--space-1) 0 var(--space-1);
  }

  .directions-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: var(--space-1);
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .directions-btn svg { width: 15px; height: 15px; flex: 0 0 auto; }

  .allergy-disclaimer {
    background: var(--chip-other);
    border: 1px solid var(--gold-soft);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 12.5px;
    color: var(--text);
    margin-bottom: var(--space-2);
  }

  .dashboard-subnav {
    display: flex;
    gap: var(--space-1);
    margin-top: var(--space-2);
  }
  .dashboard-subnav button {
    flex: 0 0 auto;
    padding: 7px 16px;
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border);
    cursor: pointer;
    font-family: inherit;
  }
  .dashboard-subnav button.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-2);
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: var(--space-2);
    text-align: center;
  }
  .stat-card-value {
    font-family: var(--font-ui);
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-card-label {
    font-size: 12px;
    color: var(--text-hint);
    margin-top: 4px;
  }

  .dashboard-listing-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-2);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: var(--space-2);
    margin-bottom: var(--space-1);
  }
  .dashboard-listing-info { flex: 1; min-width: 0; }
  .dashboard-listing-category { font-weight: 700; font-size: 14px; }
  .dashboard-listing-meta { font-size: 12px; color: var(--text-hint); margin-top: 2px; }
  .dashboard-listing-status {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    margin-top: 4px;
  }
  .dashboard-listing-status.active { background: var(--chip-grocery); color: var(--text); }
  .dashboard-listing-status.sold_out { background: var(--border); color: var(--text-hint); }
  .dashboard-listing-status.cancelled { background: var(--border); color: var(--text-hint); }
  .dashboard-cancel-btn {
    flex: 0 0 auto;
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .dashboard-cancel-btn:disabled { opacity: 0.5; cursor: default; }

  .pickup-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-2);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: var(--space-2);
    margin-bottom: var(--space-1);
  }
  .pickup-row-code {
    font-family: var(--font-ui);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent);
  }
  .pickup-row-meta { font-size: 12px; color: var(--text-hint); margin-top: 2px; }
  .pickup-confirm-btn {
    flex: 0 0 auto;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .pickup-confirm-btn:disabled { opacity: 0.5; cursor: default; }

  .dashboard-profile-photo-row {
    display: flex;
    gap: var(--space-2);
    align-items: center;
  }
  .photo-upload-btn {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .photo-upload-hint {
    font-size: 11.5px;
    color: var(--text-hint);
    margin-top: 6px;
  }
  .description-char-count {
    font-size: 11px;
    color: var(--text-hint);
    text-align: right;
    margin-top: -6px;
    margin-bottom: var(--space-1);
  }

  .card {
    display: flex;
    gap: var(--space-2);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: var(--space-2);
    box-shadow: 0 2px 8px var(--shadow);
    animation: card-in 220ms ease-out backwards;
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(6px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }

  .card-photo {
    width: 80px;
    height: 80px;
    border-radius: 14px;
    background: var(--bg);
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; }

  /* Merchant detail ("Rescue") screen: merchant identity already shown
     once in the header above, so package cards here go category-icon-only
     and drop merchant photo/name/location entirely — see cardHtml()'s
     compact branch. */
  .card-compact .card-photo {
    width: 56px;
    height: 56px;
    border: 1.4px solid var(--gold);
  }
  .card-row-meta {
    justify-content: flex-start;
    gap: var(--space-2);
    align-items: center;
    margin-top: 8px;
  }

  /* Flat glyph presentation: icon inside a soft rounded color chip,
     category-tinted, no gradients/detail — one visual language. */
  .icon-chip {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: inherit;
  }
  .icon-chip svg { width: 60%; height: 60%; }
  .icon-chip.cat-bakery { background: var(--chip-bakery); color: var(--accent); }
  .icon-chip.cat-cafe_lunch { background: var(--chip-cafe_lunch); color: var(--gold); }
  .icon-chip.cat-restaurant_meal { background: var(--chip-restaurant_meal); color: var(--accent); }
  .icon-chip.cat-grocery { background: var(--chip-grocery); color: var(--gold); }
  .icon-chip.cat-other { background: var(--chip-other); color: var(--text-hint); }

  .card-body { flex: 1; min-width: 0; }
  .card-merchant-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    flex-wrap: wrap;
  }
  .card-merchant { font-family: var(--font-ui); font-weight: 700; font-size: 15px; }
  .card-rating { color: var(--gold); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .card-location { color: var(--text-hint); font-size: 12px; margin-top: 2px; }
  .card-description {
    color: var(--text-hint);
    font-size: 12px;
    margin-top: 2px;
    font-style: italic;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card-category {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin-top: var(--space-1);
  }

  /* Compact card (merchant detail) top row: category pill on the left,
     qty badge on the right — kept as its own row, separate from price,
     so the qty badge (the one dominant accent) never has to share visual
     weight with the price/discount elements below it. */
  .card-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-category-pill {
    display: inline-block;
    background: var(--chip-other);
    color: var(--text);
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .card-price-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-top: 10px;
  }

  .card-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: var(--space-1);
  }

  .price-original {
    text-decoration: line-through;
    color: var(--text-hint);
    font-size: 12px;
    margin-right: 6px;
  }
  /* .card-price-row already spaces children via flex gap. */
  .card-price-row .price-original { margin-right: 0; }
  .price-discounted { font-weight: 700; font-size: 17px; color: var(--accent); }
  .card-price-row .price-discounted { font-size: 22px; }

  .savings-badge {
    display: inline-block;
    background: var(--gold);
    color: var(--text);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .pickup-time { font-size: 12px; color: var(--text-hint); }

  /* The urgency signal ("N left") is the strongest accent element next to
     the price — always crimson and bolder/larger than the discount
     badge, not just when stock is critically low. A merchant-detail card
     with only 2-3 packages to begin with makes "3 left" itself an
     urgency signal, not a neutral inventory count. */
  .qty-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    padding: 4px 11px;
    border-radius: 999px;
    margin-top: 4px;
    background: var(--accent);
    color: var(--accent-text);
  }
  .qty-badge.low {
    background: var(--accent-deep);
  }

  .reserve-btn {
    margin-top: 10px;
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: transform 150ms ease, background 150ms ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .reserve-btn:active { transform: scale(0.97); }
  .reserve-btn:disabled { opacity: 0.5; cursor: default; }
  .reserve-btn.confirmed {
    background: var(--gold);
    color: var(--text);
    opacity: 1;
    animation: confirm-pop 220ms ease-out;
  }
  @keyframes confirm-pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .empty-state, .loading-state {
    text-align: center;
    color: var(--text-hint);
    padding: 48px var(--space-2);
    font-size: 14px;
  }
  .empty-state-icons {
    display: flex;
    justify-content: center;
    gap: var(--space-2);
    margin-bottom: var(--space-2);
  }
  .empty-state-icons svg { width: 40px; height: 40px; }
  .empty-state strong {
    display: block;
    font-family: var(--font-ui);
    color: var(--text);
    font-size: 16px;
    margin-bottom: 4px;
  }

  /* Scattered decorative accents — hand-drawn, not tied to any listing */
  .header-doodles {
    position: absolute;
    top: 0;
    right: 0;
    pointer-events: none;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  .lang-switch {
    position: absolute;
    top: var(--space-1);
    right: var(--space-2);
    display: flex;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    z-index: 5;
  }
  .lang-switch button {
    border: none;
    background: transparent;
    color: var(--text-hint);
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 999px;
    cursor: pointer;
  }
  .lang-switch button.active {
    background: var(--accent);
    color: var(--accent-text);
  }
  .header-doodles svg {
    position: absolute;
    opacity: 0.55;
  }
  .doodle-1 { top: 40px; right: 14px; width: 28px; height: 28px; transform: rotate(8deg); }
  .doodle-2 { top: 78px; right: 60px; width: 20px; height: 20px; transform: rotate(-12deg); opacity: 0.35; }

  #mapView {
    display: none;
    position: relative;
  }
  #mapView.active { display: block; animation: view-in 180ms ease-out; }
  #listView.hidden { display: none; }
  .hidden { display: none !important; }

  #mapCanvas {
    width: 100%;
    height: calc(100vh - 132px - 64px);
    min-height: 260px;
    background: var(--surface);
  }

  .map-unavailable {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: calc(100vh - 132px - 64px);
    min-height: 260px;
    padding: var(--space-3);
    text-align: center;
    color: var(--text-hint);
    font-size: 14px;
    gap: var(--space-1);
  }
  .map-unavailable strong { color: var(--text); font-size: 15px; }

  .map-pin {
    width: 34px;
    height: 34px;
    border-radius: 50% 50% 50% 0;
    background: var(--accent);
    transform: rotate(-45deg);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px var(--shadow);
    border: 2px solid var(--accent-text);
    cursor: pointer;
  }
  .map-pin span, .map-pin svg {
    transform: rotate(45deg);
    font-size: 16px;
    color: var(--accent-text);
  }
  .map-pin.multi {
    background: var(--gold);
  }
  .map-pin.multi span {
    font-weight: 700;
    font-family: var(--font-ui);
  }

  .map-sheet {
    position: fixed;
    left: var(--space-2);
    right: var(--space-2);
    bottom: calc(64px + var(--space-2));
    max-width: 480px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: var(--space-2);
    box-shadow: 0 -4px 24px var(--shadow);
    max-height: 45vh;
    overflow-y: auto;
    z-index: 50;
    display: none;
  }
  .map-sheet.show { display: block; }
  .map-sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--space-1);
  }
  .map-sheet-title { font-weight: 700; font-size: 15px; }
  .map-sheet-close {
    border: none;
    background: var(--bg);
    color: var(--text-hint);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
  }
  .map-sheet .card {
    margin-bottom: var(--space-1);
    padding: var(--space-1) var(--space-2);
  }
  .map-sheet .card:last-child { margin-bottom: 0; }

  .toast {
    position: fixed;
    bottom: calc(64px + var(--space-2));
    left: var(--space-2);
    right: var(--space-2);
    max-width: 480px;
    margin: 0 auto;
    background: var(--accent);
    color: var(--accent-text);
    padding: 14px 16px;
    border-radius: 14px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 8px 24px var(--shadow);
    transform: translateY(20px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: transform 0.25s ease, opacity 0.25s ease, visibility 0s linear 0.25s;
    z-index: 100;
  }
  .toast.show {
    transform: translateY(0);
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: transform 0.25s ease, opacity 0.25s ease, visibility 0s linear 0s;
  }

  /* Bottom tab bar */
  body { padding-bottom: calc(64px + var(--space-2)); }
  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 64px;
    display: flex;
    justify-content: center;
    background: var(--surface);
    border-top: 1px solid var(--border);
    z-index: 60;
  }
  .tab-bar-inner {
    display: flex;
    width: 100%;
    max-width: 480px;
  }
  .tab-bar button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    border: none;
    background: transparent;
    color: var(--text-hint);
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .tab-bar button svg { width: 22px; height: 22px; }
  .tab-bar button.active { color: var(--accent); }

  .screen { display: none; }
  .screen.active { display: block; animation: view-in 180ms ease-out; }

  .profile-order {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: var(--space-2);
    margin-bottom: var(--space-2);
    cursor: pointer;
  }
  .reservation-detail-price {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 20px;
    color: var(--accent);
    margin-top: 4px;
  }
  .profile-order-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .profile-order-merchant { font-family: var(--font-ui); font-weight: 700; font-size: 15px; }
  .profile-order-meta { color: var(--text-hint); font-size: 12px; margin-top: 2px; }
  .status-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status-badge.reserved { background: var(--gold); color: var(--text); }
  .status-badge.picked_up { background: var(--accent); color: var(--accent-text); }
  .status-badge.no_show { background: var(--border); color: var(--text-hint); }
  .status-badge.cancelled { background: var(--border); color: var(--text-hint); }

  .pickup-code-display {
    margin-top: var(--space-2);
    padding: var(--space-2);
    background: var(--bg);
    border: 1.5px dashed var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .pickup-code-display .label {
    font-size: 11px;
    color: var(--text-hint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .pickup-code-display .code {
    font-family: var(--font-ui);
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
  }

  .review-form {
    margin-top: var(--space-2);
    padding-top: var(--space-2);
    border-top: 1px solid var(--border);
  }
  .review-label {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .review-dimension-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-1);
    margin-bottom: 6px;
  }
  .review-dimension-label {
    font-size: 13px;
    color: var(--text);
    flex: 0 0 auto;
  }
  .star-picker { display: flex; gap: 2px; }
  .star-btn {
    background: none;
    border: none;
    font-size: 22px;
    line-height: 1;
    color: var(--border);
    cursor: pointer;
    padding: 2px;
  }
  .star-btn.selected { color: var(--gold); }
  .review-comment {
    width: 100%;
    min-height: 56px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: var(--font-ui);
    font-size: 13px;
    color: var(--text);
    background: var(--surface);
    resize: vertical;
    margin-bottom: var(--space-1);
  }
  .review-submit-btn {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .review-submit-btn:disabled { opacity: 0.5; cursor: default; }

  .profile-section-title {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 15px;
    margin: var(--space-3) 0 var(--space-1);
  }
  .profile-section-title:first-child { margin-top: 0; }
</style>
</head>
<body>

<div class="screen active" id="browseScreen">
  <header>
    <div class="header-doodles">
      <svg class="doodle-1" viewBox="0 0 34 34"><use href="#doodle-croissant"/></svg>
      <svg class="doodle-2" viewBox="0 0 34 34"><use href="#doodle-apple"/></svg>
    </div>
    <div class="content-col">
      <div class="lang-switch" id="langSwitch">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="kk">KZ</button>
      </div>
      <div class="brand-lockup">
        <img class="brand-mark" src="/assets/sarqyt-heart-192.png" alt="" width="28" height="28" />
        <span class="brand-word">Sarqyt</span>
      </div>
      <h1 data-i18n="title">Cafes near you</h1>
      <!-- Category filter chips and price/sort dropdowns filter/sort the
           merchant list (allMerchants), not individual bags — a merchant
           matches if ANY of its active bags fit the filter. Decided when
           this was rewired: filters narrow which merchants are worth
           opening; the merchant detail screen intentionally shows all of
           an opened merchant's bags unfiltered. -->
      <div class="filters" id="categoryFilters"></div>
      <div class="toolbar">
        <div class="toolbar-dropdowns">
          <div class="dropdown" id="maxPriceDropdown">
            <button class="dropdown-trigger" type="button">
              <span class="dropdown-label" data-i18n="price_any">Any price</span>
              <span class="chev">▾</span>
            </button>
            <div class="dropdown-menu">
              <div class="dropdown-option selected" data-value="" data-i18n="price_any">Any price</div>
              <div class="dropdown-option" data-value="500" data-i18n-price="500">≤ 500 ₸</div>
              <div class="dropdown-option" data-value="1000" data-i18n-price="1000">≤ 1000 ₸</div>
              <div class="dropdown-option" data-value="2000" data-i18n-price="2000">≤ 2000 ₸</div>
              <div class="dropdown-option" data-value="5000" data-i18n-price="5000">≤ 5000 ₸</div>
            </div>
          </div>
          <div class="dropdown" id="sortDropdown">
            <button class="dropdown-trigger" type="button">
              <span class="dropdown-label" data-i18n="sort_pickup">Pickup time</span>
              <span class="chev">▾</span>
            </button>
            <div class="dropdown-menu">
              <div class="dropdown-option selected" data-value="pickup" data-i18n="sort_pickup">Pickup time</div>
              <div class="dropdown-option" data-value="price" data-i18n="sort_price">Price: low to high</div>
            </div>
          </div>
        </div>
        <div class="view-toggle" id="viewToggle">
          <button type="button" class="active" data-view="list">
            <svg viewBox="0 0 24 24"><use href="#glyph-browse"/></svg> <span data-i18n="tab_list">List</span>
          </button>
          <button type="button" data-view="map">
            <svg viewBox="0 0 24 24"><use href="#glyph-map"/></svg> <span data-i18n="tab_map">Map</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="listView" class="content-col">
    <div class="loading-state" data-i18n="loading_listings">Finding today's good stuff…</div>
  </main>

  <div id="mapView">
    <div class="content-col" id="mapViewInner">
      <div id="mapCanvas"></div>
    </div>
  </div>

  <div class="map-sheet" id="mapSheet">
    <div class="map-sheet-header">
      <div class="map-sheet-title" id="mapSheetTitle"></div>
      <button class="map-sheet-close" id="mapSheetClose">✕</button>
    </div>
    <div id="mapSheetCards"></div>
  </div>
</div>

<div class="screen" id="profileScreen">
  <header>
    <div class="content-col">
      <div class="brand-lockup">
        <img class="brand-mark" src="/assets/sarqyt-heart-192.png" alt="" width="28" height="28" />
        <span class="brand-word">Sarqyt</span>
      </div>
      <h1 data-i18n="profile_title">Your reservations</h1>
    </div>
  </header>
  <main id="profileContent" class="content-col">
    <div class="loading-state" data-i18n="loading_orders">Loading your reservations…</div>
  </main>

  <div class="map-sheet" id="reservationSheet">
    <div class="map-sheet-header">
      <div class="map-sheet-title" id="reservationSheetTitle"></div>
      <button class="map-sheet-close" id="reservationSheetClose">✕</button>
    </div>
    <div id="reservationSheetContent"></div>
  </div>
</div>

<div class="screen" id="merchantDetailScreen">
  <header>
    <div class="content-col">
      <button type="button" class="back-btn" id="merchantDetailBack">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        <span data-i18n="back">Back</span>
      </button>
    </div>
  </header>
  <main id="merchantDetailContent" class="content-col">
    <div class="loading-state" data-i18n="loading_listings">Finding today's good stuff…</div>
  </main>
</div>

<div class="screen" id="dashboardScreen">
  <header>
    <div class="content-col">
      <div class="brand-lockup">
        <img class="brand-mark" src="/assets/sarqyt-heart-192.png" alt="" width="28" height="28" />
        <span class="brand-word">Sarqyt</span>
      </div>
      <h1 data-i18n="dashboard_title">Your dashboard</h1>
      <div class="dashboard-subnav" id="dashboardSubnav">
        <button type="button" class="active" data-dsub="stats" data-i18n="dashboard_tab_stats">Stats</button>
        <button type="button" data-dsub="listings" data-i18n="dashboard_tab_listings">Listings</button>
        <button type="button" data-dsub="pickups" data-i18n="dashboard_tab_pickups">Pickups</button>
        <button type="button" data-dsub="profile" data-i18n="dashboard_tab_profile">Profile</button>
      </div>
    </div>
  </header>
  <main id="dashboardContent" class="content-col">
    <div class="loading-state" data-i18n="loading_listings">Finding today's good stuff…</div>
  </main>
</div>

<div class="tab-bar">
  <div class="tab-bar-inner">
    <button type="button" class="active" data-tab="browse">

let currentLang = "en";

function t(key, ...args) {
  const dict = TRANSLATIONS[currentLang] || TRANSLATIONS.en;
  const value = dict[key] ?? TRANSLATIONS.en[key];
  return typeof value === "function" ? value(...args) : value;
}

function categoryLabel(category) {
  const dict = TRANSLATIONS[currentLang] || TRANSLATIONS.en;
  return (dict.category && dict.category[category]) || TRANSLATIONS.en.category[category] || category;
}

function qtyLeftLabel(n) {
  return t("qty_left", n);
}

function detectInitialLang() {
  const stored = (() => {
    try { return localStorage.getItem("lang"); } catch (e) { return null; }
  })();
  if (stored && TRANSLATIONS[stored]) return stored;

  const tgLang = tg?.initDataUnsafe?.user?.language_code;
  if (tgLang && TRANSLATIONS[tgLang]) return tgLang;

  return "en";
}

function setLang(lang) {
  if (!TRANSLATIONS[lang]) lang = "en";
  currentLang = lang;
  try { localStorage.setItem("lang", lang); } catch (e) { /* ignore */ }
  applyStaticTranslations();
  document.querySelectorAll(".lang-switch button").forEach((b) => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });
  renderCategoryFilters();
  renderMerchantList();
  if (document.getElementById("profileScreen").classList.contains("active")) {
    loadProfile();
  }
}

function applyStaticTranslations() {
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  document.querySelectorAll("[data-i18n-price]").forEach((el) => {
    el.textContent = t("price_le", el.dataset.i18nPrice);
  });

  // Selected dropdown labels need re-syncing since they mirror whichever
  // option is currently selected, not a fixed key.
  document.querySelectorAll(".dropdown").forEach((dropdown) => {
    const selected = dropdown.querySelector(".dropdown-option.selected");
    const label = dropdown.querySelector(".dropdown-label");
    if (selected && label) label.textContent = selected.textContent;
  });
}

// Rounds to the nearest :00/:15/:30/:45 before formatting. Real merchant
// input (the bot's /post_listing HH:MM prompt) always produces exact
// minutes, but test/seed data built from `now + timedelta(...)` inherits
// whatever second/minute `now()` happened to be at, producing odd values
// like 16:16 — this defends the display layer against that regardless of
// where slightly-off data comes from. Rounding the absolute timestamp
// (rather than the Almaty-local wall-clock minute) is safe here since
// Asia/Almaty's UTC+5 offset has no fractional-minute component, so a
// 15-minute rounding boundary lines up the same way in either timezone.
function formatTime(iso) {
  const d = new Date(iso);
  const roundedMs = Math.round(d.getTime() / (15 * 60 * 1000)) * (15 * 60 * 1000);
  const rounded = new Date(roundedMs);
  return rounded.toLocaleTimeString("en-GB", {
    hour: "2-digit",
    minute: "2-digit",
    timeZone: "Asia/Almaty",
  });
}

function setupDropdown(id, onSelect) {
  const root = document.getElementById(id);
  const trigger = root.querySelector(".dropdown-trigger");
  const label = root.querySelector(".dropdown-label");
  const options = root.querySelectorAll(".dropdown-option");

  trigger.addEventListener("click", (e) => {
    e.stopPropagation();
    document.querySelectorAll(".dropdown.open").forEach((d) => {
      if (d !== root) d.classList.remove("open");
    });
    root.classList.toggle("open");
  });

  options.forEach((opt) => {
    opt.addEventListener("click", () => {
      options.forEach((o) => o.classList.remove("selected"));
      opt.classList.add("selected");
      label.textContent = opt.textContent;
      root.classList.remove("open");
      onSelect(opt.dataset.value);
    });
  });
}

document.addEventListener("click", () => {
  document.querySelectorAll(".dropdown.open").forEach((d) => d.classList.remove("open"));
});

setupDropdown("maxPriceDropdown", (value) => {
  maxPriceValue = value;
  renderMerchantList();
  renderMapMarkers();

setupDropdown("sortDropdown", (value) => {
  sortValue = value;
  renderMerchantList();
});

function renderCategoryFilters() {
  const container = document.getElementById("categoryFilters");
  const categories = ["all", ...new Set(allMerchants.flatMap((m) => m.categories || []))];
  container.innerHTML = categories
    .map((cat) => {
      const label = cat === "all" ? t("filter_all") : categoryLabel(cat);
      const active = cat === activeCategory ? "active" : "";
      return `<button class="filter-chip ${active}" data-category="${cat}">${label}</button>`;
    })
    .join("");

  container.querySelectorAll(".filter-chip").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategoryFilters();
      renderMerchantList();
      renderMapMarkers();
    });
  });
}

// Filters/sorts the MERCHANT list (not individual bags) — a merchant
// matches the category filter if ANY of their active listings are in
// that category, and the price filter if their cheapest active bag is at
// or under the chosen threshold. This scope was decided deliberately
// when the browse screen was restructured into a merchant list: filters
// narrow which merchants are worth opening, not which of an already-
// opened merchant's few bags to look at (see the merchant detail screen,
// which intentionally shows all of that merchant's bags unfiltered).
function getFilteredSortedMerchants() {
  let items = allMerchants;

  if (activeCategory !== "all") {
    items = items.filter((m) => (m.categories || []).includes(activeCategory));
  }

  if (maxPriceValue) {
    items = items.filter((m) => m.min_price <= Number(maxPriceValue));
  }

  items = [...items].sort((a, b) => {
    if (sortValue === "price") return a.min_price - b.min_price;
    return new Date(a.earliest_pickup_start) - new Date(b.earliest_pickup_start);
  });

  return items;
}

// compact=true is for the merchant detail ("Rescue") screen, where every
// card already belongs to the merchant named once in the header above —
// showing merchant photo/name/location/description per card there is
// pure duplication. compact mode drops all of that and always shows a
// category icon tile instead (never the merchant photo), which also
// matches the product rule that a listing exposes category, not the
// merchant's storefront image, once merchant identity is already known
// from context. The flat browse feed (compact=false, the default) still
// needs merchant identity per card, since each card there is a different
// merchant.
function cardHtml(listing, index = 0, compact = false) {
  const discountPct = Math.round(
    (1 - listing.discounted_price / listing.original_price) * 100
  );
  const delay = Math.min(index, 6) * 40;
  const isLow = listing.quantity_remaining <= 2;

  if (compact) {
    // Top row: category pill (secondary, left) + qty badge (the one
    // standout accent, right) — kept apart from the price row entirely so
    // "N left" doesn't visually compete with price/discount for
    // attention, and reads as the single dominant signal next to price
    // per the reference layout.
    return `
      <div class="card card-compact" style="animation-delay:${delay}ms">
        <div class="card-photo"><span class="icon-chip cat-${listing.category}"><svg viewBox="0 0 24 24"><use href="#${CATEGORY_GLYPHS[listing.category] || CATEGORY_GLYPHS.other}"/></svg></span></div>
        <div class="card-body">
          <div class="card-top-row">
            <span class="card-category-pill">${escapeHtml(categoryLabel(listing.category))}</span>
            <span class="qty-badge${isLow ? " low" : ""}">${qtyLeftLabel(listing.quantity_remaining)}</span>
          </div>
          <div class="card-price-row">
            <span class="price-original">${listing.original_price} ₸</span>
            <span class="price-discounted">${listing.discounted_price} ₸</span>
            <span class="savings-badge">-${discountPct}%</span>
          </div>
          <div class="pickup-time">${formatTime(listing.pickup_window_start)}–${formatTime(listing.pickup_window_end)}</div>
          <button class="reserve-btn" data-id="${listing.id}">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M4 12l6-6M4 12l6 6"/></svg>
            ${t("reserve")}
          </button>
        </div>
      </div>
    `;
  }

  const photo = listing.merchant_photo_file_id
    ? `<img src="/api/photo/${listing.merchant_photo_file_id}" alt="" />`
    : categoryIconChip(listing.category);
  return `
    <div class="card" style="animation-delay:${delay}ms">
      <div class="card-photo">${photo}</div>
      <div class="card-body">
        <div class="card-merchant-row">
          <div class="card-merchant">${escapeHtml(listing.merchant_name)}</div>
          ${listing.merchant_rating ? `<span class="card-rating">★ ${listing.merchant_rating.toFixed(1)} (${listing.merchant_rating_count})</span>` : ""}
        </div>
        <div class="card-location">${escapeHtml(listing.location_text)}</div>
        ${listing.merchant_description ? `<div class="card-description">${escapeHtml(listing.merchant_description)}</div>` : ""}
        <div class="card-category">${escapeHtml(categoryLabel(listing.category))}</div>
        <span class="qty-badge${isLow ? " low" : ""}">${qtyLeftLabel(listing.quantity_remaining)}</span>
        <div class="card-row">
          <div>
            <span class="price-original">${listing.original_price} ₸</span>
            <span class="price-discounted">${listing.discounted_price} ₸</span>
            <span class="savings-badge">-${discountPct}%</span>
          </div>
          <div class="pickup-time">${formatTime(listing.pickup_window_start)}–${formatTime(listing.pickup_window_end)}</div>
        </div>
        <button class="reserve-btn" data-id="${listing.id}">${t("reserve")}</button>
      </div>
    </div>
  `;
}

// --- Overlay state (single source of truth) ---
//
// Any view that layers on top of the normal tab content — the full-screen
// merchant detail view, the map-pin bottom sheet, and any future overlay
// (a rating screen, a filter panel, etc.) — must register itself here so
// switching tabs can never leave a stale overlay stacked on top of
// whatever's underneath. activeOverlay is the ONE flag that says what's
// currently open; there is deliberately no second "is X visible" state
// (a CSS class, a boolean) that could drift out of sync with it. Adding a
// new overlay means adding one case to closeAllOverlays(), not touching
// every navigation entry point that could switch away from it.
let activeOverlay = null; // null | "merchantDetail" | "mapSheet"

function closeAllOverlays() {
  if (activeOverlay === "merchantDetail") closeMerchantDetail();
  else if (activeOverlay === "mapSheet") closeMapSheet();
  else if (activeOverlay === "reservationDetail") closeReservationDetail();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

// Opens walking directions to (lat, lng) via 2GIS's own https:// link —
// NOT the dgis:// custom scheme. Telegram's in-app WebView silently drops
// navigation to non-http(s) custom schemes (a long-standing, unfixed
// Telegram bug: tdlib/telegram-bot-api#299, still-open
// TelegramMessenger/Telegram-iOS#244) with no failure signal to detect,
// which makes a "try dgis://, fall back after a timeout" approach
// fundamentally unworkable inside this app's actual runtime — it would
// silently fail every time with no way to catch it. The https://2gis.kz
// link instead goes through standard iOS/Android universal-link
// association files (confirmed present and covering /directions/* on
// 2gis.kz), so it opens the native 2GIS app when installed and degrades
// to the 2GIS website otherwise — one link, both cases, and it actually
// works through tg.openLink() since that only handles http(s) URLs.
//
// Coordinate order in the path is lon,lat (not lat,lon) — confirmed
// against live 2GIS URLs, not assumed.
function openDirections(lat, lng) {
  const url = `https://2gis.kz/almaty/directions/tab/pedestrian/points/%7C${lng}%2C${lat}`;
  if (tg?.openLink) {
    tg.openLink(url);
  } else {
    window.location.href = url;
  }
}

async function reserveListing(listingId, buttonEl) {
  buttonEl.disabled = true;
  buttonEl.textContent = t("reserving");
  try {
    const res = await fetch(`/api/listings/${listingId}/reserve`, {
      method: "POST",
      headers: { "X-Telegram-Init-Data": getInitData() },
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showToast(err.detail || t("toast_network_error"));
      buttonEl.disabled = false;
      buttonEl.textContent = t("reserve");
      // Someone else may have just taken the last bag — refresh whichever
      // view is showing this listing so it reflects reality instead of a
      // stale reservable card. loadMerchants() also refreshes alongside
      // loadListings() when reserving from the map sheet (not a merchant
      // detail screen), so the merchant list's own bag_count/min_price
      // don't go stale too — found while auditing for the same
      // "still pointing at old state" pattern as the filter fix above.
      if (currentMerchantId != null) {
        await loadMerchantDetail();
      } else {
        await loadListings();
        await loadMerchants();
      }
      return;
    }
    const data = await res.json();
    playConfirmAnimation(buttonEl);
    showToast(t("toast_reserved", data.pickup_code));
    tg?.HapticFeedback?.notificationOccurred("success");
    if (currentMerchantId != null) {
      await loadMerchantDetail();
    } else {
      await loadListings();
      await loadMerchants();
    }
  } catch (e) {
    showToast(t("toast_network_error"));
    buttonEl.disabled = false;
    buttonEl.textContent = t("reserve");
  }
}

function playConfirmAnimation(buttonEl) {
  buttonEl.textContent = t("reserved_saved");
  buttonEl.classList.add("confirmed");
}

async function loadListings() {
  // Feeds allListings for the map view only — the default Browse view is
  // the merchant list (see loadMerchants()), which reads from allMerchants
  // instead. renderMapMarkers() applies the same activeCategory/
  // maxPriceValue filter state as the merchant list (see its own comment)
  // so List and Map stay in sync when a filter changes.
  try {
    const res = await fetch("/api/listings");
    allListings = await res.json();
    renderMapMarkers();
  } catch (e) {
    // Map markers just won't populate; this is a background data load for
    // a view the user may not even open, so no user-facing error state.
  }
}

const ALMATY_CENTER = [76.9286, 43.2380]; // [lng, lat] — 2GIS uses lng,lat order

document.getElementById("viewToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-view]");

  // Switching List <-> Map must always close whatever overlay (map-pin

  document.getElementById("mapView").classList.toggle("active", view === "map");

  if (view === "map" && mapInstance) {

    setTimeout(() => mapInstance.invalidateSize?.(), 50);

});

// --- 2GIS map ---

let mapInstance = null;
let mapMarkers = [];
let twogisApiKey = null;

async function initMap() {
  try {
    const res = await fetch("/api/config");
    const config = await res.json();
    twogisApiKey = config.twogis_api_key;
  } catch (e) {
    twogisApiKey = null;
  }

  const mapCanvas = document.getElementById("mapCanvas");

  if (!twogisApiKey || typeof mapgl === "undefined") {
    mapCanvas.outerHTML = `
      <div class="map-unavailable">
        <strong>${t("map_unavailable_title")}</strong>
        <span>${t("map_unavailable_body")}</span>
      </div>
    `;
    return;
  }

  mapInstance = new mapgl.Map("mapCanvas", {
    center: ALMATY_CENTER,
    zoom: 12,
    key: twogisApiKey,
  });

  renderMapMarkers();
}

function renderMapMarkers() {
  if (!mapInstance) return;

  mapMarkers.forEach((m) => m.destroy());
  mapMarkers = [];

  // Explicitly applies the same category/price filter state as the
  // merchant list (activeCategory/maxPriceValue are shared module-level
  // state, deliberately — filtering the list and switching to Map should
  // show the same narrowed set of merchants, not silently diverge). Built
  // straight from allListings rather than routing through the dead
  // getFilteredSorted()/allListings pairing that predates the merchant-
  // list restructure — that path happened to look correct only because
  // the filters were disconnected until now.
  let items = allListings.filter((l) => l.latitude != null && l.longitude != null);
  if (activeCategory !== "all") {
    items = items.filter((l) => l.category === activeCategory);
  }
  if (maxPriceValue) {
    items = items.filter((l) => l.discounted_price <= Number(maxPriceValue));
  }

  // Group listings by merchant location so one pin represents one merchant.
  const byMerchant = new Map();
  items.forEach((listing) => {
    const key = `${listing.merchant_name}|${listing.latitude}|${listing.longitude}`;
    if (!byMerchant.has(key)) byMerchant.set(key, []);
    byMerchant.get(key).push(listing);
  });

  byMerchant.forEach((merchantListings) => {
    const { latitude, longitude } = merchantListings[0];
    const isMulti = merchantListings.length > 1;
    const glyph = CATEGORY_GLYPHS[merchantListings[0].category] || CATEGORY_GLYPHS.other;
    const iconHtml = isMulti
      ? `<span>${merchantListings.length}</span>`
      : `<svg viewBox="0 0 24 24" width="16" height="16"><use href="#${glyph}"/></svg>`;

    const el = document.createElement("div");
    el.className = `map-pin${isMulti ? " multi" : ""}`;
    el.innerHTML = iconHtml;
    el.addEventListener("click", () => showMapSheet(merchantListings));

    const marker = new mapgl.HtmlMarker(mapInstance, {
      coordinates: [longitude, latitude],
      html: el,
      anchor: [17, 34],
    });
    mapMarkers.push(marker);
  });
}

function showMapSheet(merchantListings) {
  closeAllOverlays();
  activeOverlay = "mapSheet";
  document.getElementById("mapSheetTitle").textContent = merchantListings[0].merchant_name;
  document.getElementById("mapSheetCards").innerHTML = merchantListings.map(cardHtml).join("");
  attachReserveHandlers(document.getElementById("mapSheetCards"));

async function renderDashboardStats(container) {
  const res = await fetch("/api/merchant/stats", {
    headers: { "X-Telegram-Init-Data": getInitData() },
  });
  if (!res.ok) throw new Error("failed");
  const stats = await res.json();

  container.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-card-value">${stats.listings_posted}</div>
        <div class="stat-card-label">${t("stat_listings_posted")}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value">${stats.bags_posted}</div>
        <div class="stat-card-label">${t("stat_bags_posted")}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value">${stats.bags_sold}</div>
        <div class="stat-card-label">${t("stat_bags_sold")}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value">${stats.bags_remaining}</div>
        <div class="stat-card-label">${t("stat_bags_remaining")}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value">${stats.no_shows}</div>
        <div class="stat-card-label">${t("stat_no_shows")}</div>
      </div>
    </div>
  `;
}

function dashboardListingRowHtml(listing) {
  const canCancel = listing.status === "active";
  return `
    <div class="dashboard-listing-row">
      <div class="dashboard-listing-info">
        <div class="dashboard-listing-category">${escapeHtml(categoryLabel(listing.category))}</div>
        <div class="dashboard-listing-meta">${listing.discounted_price} ₸ · ${listing.quantity_remaining}/${listing.quantity_total} left · ${formatTime(listing.pickup_window_start)}–${formatTime(listing.pickup_window_end)}</div>
        <span class="dashboard-listing-status ${listing.status}">${t("listing_status_" + listing.status)}</span>
      </div>
      ${canCancel ? `<button type="button" class="dashboard-cancel-btn" data-listing="${listing.id}">${t("cancel_listing")}</button>` : ""}
    </div>
  `;
}

async function renderDashboardListings(container) {
  const res = await fetch("/api/merchant/listings", {
    headers: { "X-Telegram-Init-Data": getInitData() },
  });
  if (!res.ok) throw new Error("failed");
  const listings = await res.json();

  if (listings.length === 0) {
    container.innerHTML = `<div class="empty-state">${t("empty_dashboard_listings")}</div>`;
    return;
  }

  container.innerHTML = listings.map(dashboardListingRowHtml).join("");
  container.querySelectorAll(".dashboard-cancel-btn").forEach((btn) => {
    btn.addEventListener("click", () => cancelDashboardListing(Number(btn.dataset.listing), btn));
  });
}

async function cancelDashboardListing(listingId, btn) {
  btn.disabled = true;
  btn.textContent = t("cancelling");
  try {
    const res = await fetch(`/api/merchant/listings/${listingId}/cancel`, {
      method: "POST",
      headers: { "X-Telegram-Init-Data": getInitData() },
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showToast(err.detail || t("toast_network_error"));
      btn.disabled = false;
      btn.textContent = t("cancel_listing");
      return;
    }
    await renderDashboardListings(document.getElementById("dashboardContent"));
  } catch (e) {
    showToast(t("toast_network_error"));
    btn.disabled = false;
    btn.textContent = t("cancel_listing");
  }
}

function pickupRowHtml(order) {
  return `
    <div class="pickup-row">
      <div>
        <div class="pickup-row-code">${escapeHtml(order.pickup_code)}</div>
        <div class="pickup-row-meta">${escapeHtml(order.category_label)} · ${formatTime(order.pickup_window_start)}–${formatTime(order.pickup_window_end)}</div>
      </div>
      <button type="button" class="pickup-confirm-btn" data-order="${order.id}">${t("confirm_pickup")}</button>
    </div>
  `;
}

async function renderDashboardPickups(container) {
  const res = await fetch("/api/merchant/pending-pickups", {
    headers: { "X-Telegram-Init-Data": getInitData() },
  });
  if (!res.ok) throw new Error("failed");
  const orders = await res.json();

  if (orders.length === 0) {
    container.innerHTML = `<div class="empty-state">${t("empty_dashboard_pickups")}</div>`;
    return;
  }

  container.innerHTML = orders.map(pickupRowHtml).join("");
  container.querySelectorAll(".pickup-confirm-btn").forEach((btn) => {
    btn.addEventListener("click", () => confirmDashboardPickup(Number(btn.dataset.order), btn));
  });
}

async function confirmDashboardPickup(orderId, btn) {
  btn.disabled = true;
  btn.textContent = t("confirming");
  try {
    const res = await fetch(`/api/merchant/pending-pickups/${orderId}/confirm`, {
      method: "POST",
      headers: { "X-Telegram-Init-Data": getInitData() },
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showToast(err.detail || t("toast_network_error"));
      btn.disabled = false;
      btn.textContent = t("confirm_pickup");
      return;
    }
    showToast(t("pickup_confirmed_toast"));
    tg?.HapticFeedback?.notificationOccurred("success");
    await renderDashboardPickups(document.getElementById("dashboardContent"));
  } catch (e) {
    showToast(t("toast_network_error"));
    btn.disabled = false;
    btn.textContent = t("confirm_pickup");
  }
}

async function renderDashboardProfile(container) {
  const res = await fetch("/api/merchant/me", {
    headers: { "X-Telegram-Init-Data": getInitData() },
  });
  if (!res.ok) throw new Error("failed");
  const merchant = await res.json();

  const photoHtml = merchant.photo_file_id
    ? `<img src="/api/photo/${merchant.photo_file_id}" alt="" />`
    : `<span class="icon-chip cat-other"><svg viewBox="0 0 24 24"><use href="#glyph-other"/></svg></span>`;

  container.innerHTML = `
    <div class="dashboard-profile-photo-row">
      <div class="merchant-detail-photo" id="dashboardPhotoPreview">${photoHtml}</div>
      <div>
        <label class="photo-upload-btn" for="dashboardPhotoInput">${t("change_photo")}</label>
        <input type="file" id="dashboardPhotoInput" accept="image/*" class="hidden" />
        <div class="photo-upload-hint">${t("photo_upload_hint")}</div>
      </div>
    </div>
    <div class="review-label" style="margin-top: var(--space-2);">${t("edit_description")}</div>
    <textarea class="review-comment" id="dashboardDescriptionInput" maxlength="${MERCHANT_DESCRIPTION_MAX_LEN}" placeholder="${t("description_placeholder")}">${escapeHtml(merchant.description || "")}</textarea>
    <div class="description-char-count" id="dashboardDescriptionCount"></div>
    <button type="button" class="review-submit-btn" id="dashboardDescriptionSave">${t("save_description")}</button>
  `;

  const countEl = document.getElementById("dashboardDescriptionCount");
  const descInput = document.getElementById("dashboardDescriptionInput");
  const updateCount = () => {
    countEl.textContent = `${descInput.value.length}/${MERCHANT_DESCRIPTION_MAX_LEN}`;
  };
  updateCount();
  descInput.addEventListener("input", updateCount);

  document.getElementById("dashboardDescriptionSave").addEventListener("click", async (e) => {
    const btn = e.target;
    btn.disabled = true;
    btn.textContent = t("saving");
    try {
      const res = await fetch("/api/merchant/description", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Telegram-Init-Data": getInitData(),
        },
        body: JSON.stringify({ description: descInput.value }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        showToast(err.detail || t("toast_network_error"));
        return;
      }
      showToast(t("description_saved"));
    } catch (e) {
      showToast(t("toast_network_error"));
    } finally {
      btn.disabled = false;
      btn.textContent = t("save_description");
    }
  });

  document.getElementById("dashboardPhotoInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    await uploadDashboardPhoto(file);
    e.target.value = "";
  });
}

async function uploadDashboardPhoto(file) {
  const preview = document.getElementById("dashboardPhotoPreview");
  const originalHtml = preview.innerHTML;
  preview.innerHTML = `<span class="icon-chip cat-other">…</span>`;

  try {
    const formData = new FormData();
    formData.append("photo", file);
    const res = await fetch("/api/merchant/photo", {
      method: "POST",
      headers: { "X-Telegram-Init-Data": getInitData() },
      body: formData,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showToast(err.detail || t("toast_network_error"));
      preview.innerHTML = originalHtml;
      return;
    }
    const data = await res.json();
    preview.innerHTML = `<img src="/api/photo/${data.photo_file_id}" alt="" />`;
    showToast(t("photo_saved"));
    tg?.HapticFeedback?.notificationOccurred("success");
  } catch (e) {
    showToast(t("toast_network_error"));
    preview.innerHTML = originalHtml;
  }
}

// --- Reservation detail sheet ---
//
// Before this, a customer's only view of a merchant's address was while
// browsing — after reserving, "My Bags" showed everything EXCEPT the
// address, so a successful reservation gave no way back to "where do I
// go for pickup" short of remembering it from browsing. This reuses the
// merchant detail screen's own address styling (.merchant-detail-location)
// rather than inventing new markup for the same piece of information.
function reservationDetailHtml(order) {
  const priceHtml = order.discounted_price != null
    ? `<div class="reservation-detail-price">${order.discounted_price} ₸</div>`
    : "";
  return `
    <div class="merchant-detail-location">${escapeHtml(order.location_text)}</div>
    ${priceHtml}
    <div class="profile-order-meta" style="margin-top: 8px;">${escapeHtml(categoryLabel(order.category))}</div>
    <div class="profile-order-meta">${formatTime(order.pickup_window_start)}–${formatTime(order.pickup_window_end)}</div>
    ${order.status === "reserved" ? `
      <div class="pickup-code-display">
        <div class="label">${t("profile_show_code")}</div>
        <div class="code">${escapeHtml(order.pickup_code)}</div>
      </div>
    ` : ""}
  `;
}

function openReservationDetail(order) {
  closeAllOverlays();
  activeOverlay = "reservationDetail";
  document.getElementById("reservationSheetTitle").textContent = order.merchant_name;
  document.getElementById("reservationSheetContent").innerHTML = reservationDetailHtml(order);
  document.getElementById("reservationSheet").classList.add("show");
}

function closeReservationDetail() {
  activeOverlay = null;
  document.getElementById("reservationSheet").classList.remove("show");
}

document.getElementById("reservationSheetClose").addEventListener("click", closeReservationDetail);

function attachOrderDetailHandlers(container, orders) {
  const byId = new Map(orders.map((o) => [o.id, o]));
  container.querySelectorAll(".profile-order").forEach((card) => {
    card.addEventListener("click", (e) => {
      // Don't open the sheet when the tap was actually on the review form
      // or the pickup-code block — those already have their own purpose.
      if (e.target.closest(".review-form") || e.target.closest(".pickup-code-display")) return;
      const order = byId.get(Number(card.dataset.orderId));
      if (order) openReservationDetail(order);
    });
  });
}

// orderCardHtml renders a summary card; tapping it (anywhere outside the
// review form / reserve-code area, which have their own interactions)
// opens the full reservation detail sheet via openReservationDetail —
// see the "Reservation detail" section above for why this exists (the
// address was previously only ever shown while browsing, never again
// after a reservation was made).
function orderCardHtml(order) {
  const label = statusLabel(order.status);
  const showCode = order.status === "reserved";
  const showReviewForm = order.status === "picked_up" && !order.reviewed;
  return `
    <div class="profile-order" data-order-id="${order.id}">
      <div class="profile-order-top">
        <div>
          <div class="profile-order-merchant">${escapeHtml(order.merchant_name)}</div>
          <div class="profile-order-meta">${escapeHtml(categoryLabel(order.category))}</div>
          <div class="profile-order-meta">${formatTime(order.pickup_window_start)}–${formatTime(order.pickup_window_end)}</div>
        </div>
        <span class="status-badge ${order.status}">${label}</span>
      </div>
      ${showCode ? `
        <div class="pickup-code-display">
          <div class="label">${t("profile_show_code")}</div>
          <div class="code">${escapeHtml(order.pickup_code)}</div>
        </div>
      ` : ""}
      ${showReviewForm ? reviewFormHtml(order.id) : ""}
    </div>
  `;
}

const REVIEW_DIMENSIONS = ["quality", "quantity", "variety"];

function reviewFormHtml(orderId) {
  const dimensionRows = REVIEW_DIMENSIONS.map((dim) => {
    const stars = [1, 2, 3, 4, 5]
      .map((n) => `<button type="button" class="star-btn" data-order="${orderId}" data-dimension="${dim}" data-value="${n}" aria-label="${n}">★</button>`)
      .join("");
    return `
      <div class="review-dimension-row">
        <div class="review-dimension-label">${t("review_dim_" + dim)}</div>
        <div class="star-picker" data-order="${orderId}" data-dimension="${dim}">${stars}</div>
      </div>
    `;
  }).join("");

  return `
    <div class="review-form" data-order="${orderId}">
      <div class="review-label">${t("leave_review")}</div>
      ${dimensionRows}
      <textarea class="review-comment" data-order="${orderId}" placeholder="${t("review_comment_placeholder")}" maxlength="300"></textarea>
      <button type="button" class="review-submit-btn" data-order="${orderId}" disabled>${t("submit_review")}</button>
    </div>
  `;
}

function attachReviewHandlers(container) {
  container.querySelectorAll(".review-form").forEach((form) => {
    const orderId = form.dataset.order;
    const selections = {};

    form.querySelectorAll(".star-picker").forEach((picker) => {
      const dimension = picker.dataset.dimension;
      picker.querySelectorAll(".star-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const value = Number(btn.dataset.value);
          selections[dimension] = value;
          picker.querySelectorAll(".star-btn").forEach((b) => {
            b.classList.toggle("selected", Number(b.dataset.value) <= value);
          });
          const submitBtn = form.querySelector(".review-submit-btn");
          const allDimensionsRated = REVIEW_DIMENSIONS.every((d) => selections[d]);
          if (submitBtn) submitBtn.disabled = !allDimensionsRated;
        });
      });
    });

    form.querySelector(".review-submit-btn")?.addEventListener("click", () => {
      submitReview(orderId, form, selections);
    });
  });
}

async function submitReview(orderId, form, selections) {
  if (!REVIEW_DIMENSIONS.every((d) => selections[d])) return;

  const commentEl = form.querySelector(".review-comment");
  const comment = commentEl?.value.trim() || null;
  const submitBtn = form.querySelector(".review-submit-btn");

  submitBtn.disabled = true;
  submitBtn.textContent = t("submitting_review");

  try {
    const res = await fetch(`/api/orders/${orderId}/review`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Telegram-Init-Data": getInitData(),
      },
      body: JSON.stringify({
        quality_rating: selections.quality,
        quantity_rating: selections.quantity,
        variety_rating: selections.variety,
        comment,
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showToast(err.detail || t("review_error"));
      submitBtn.disabled = false;
      submitBtn.textContent = t("submit_review");
      return;
    }
    const data = await res.json();
    showToast(t("review_thanks_overall", data.overall));
    tg?.HapticFeedback?.notificationOccurred("success");
    await loadProfile();
  } catch (e) {
    showToast(t("review_error"));
    submitBtn.disabled = false;
    submitBtn.textContent = t("submit_review");
  }
}

async function loadProfile() {
  const container = document.getElementById("profileContent");
  container.innerHTML = `<div class="loading-state">${t("loading_orders")}</div>`;

  try {
    const res = await fetch("/api/orders/me", {
      headers: { "X-Telegram-Init-Data": getInitData() },
    });
    if (!res.ok) throw new Error("failed");
    const orders = await res.json();

    if (orders.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icons">
            <svg viewBox="0 0 34 34"><use href="#doodle-croissant"/></svg>
          </div>
          <strong>${t("empty_orders_title")}</strong>
          ${t("empty_orders_body")}
        </div>
      `;
      return;
    }

    const active = orders.filter((o) => o.status === "reserved");
    const past = orders.filter((o) => o.status === "picked_up");
    const other = orders.filter((o) => o.status === "no_show" || o.status === "cancelled");

    let html = "";
    if (active.length) {
      html += `<div class="profile-section-title">${t("profile_active")}</div>` + active.map(orderCardHtml).join("");
    }
    if (past.length) {
      html += `<div class="profile-section-title">${t("profile_picked_up")}</div>` + past.map(orderCardHtml).join("");
    }
    if (other.length) {
      html += `<div class="profile-section-title">${t("profile_missed")}</div>` + other.map(orderCardHtml).join("");
    }
    container.innerHTML = html;
    attachReviewHandlers(container);
    attachOrderDetailHandlers(container, orders);
  } catch (e) {
    container.innerHTML = `<div class="empty-state">${t("empty_orders_error")}</div>`;
  }
}
</script>
